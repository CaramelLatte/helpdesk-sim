id: expired_password
title: "Remote User Locked Out — Expired Domain Password"
# Shown on the public scenario card. Keep it to the symptom: no cause, no fix.
summary: "A remote user back from vacation can't get onto the VPN. Terminal access to their machine."
category: account
system_template: windows_desktop
shell: powershell
description: >
  A fully remote employee returned from three weeks of leave and cannot connect to
  the VPN — every attempt says authentication failed. Two things are wrong, and both
  must be addressed: (1) their domain password expired while they were away, and
  (2) their repeated attempts with the (correct but expired) password locked the
  account. Because they are remote and pre-VPN, they cannot use the Windows logon
  screen's normal "your password has expired" change flow. Correct T1 resolution is
  to confirm both conditions with Get-ADUser, unlock the account, reset a temporary
  password with change-at-next-logon enforced, and verify the account state before
  walking the user through reconnecting. Unlocking alone is an incomplete fix — the
  expired password will immediately fail and re-lock the account. This is standard
  delegated T1 work; escalation is unnecessary.

available_commands:
  - "net user <username> /domain — quick view of account status, lockout, and password dates"
  - "Get-ADUser <username> -Properties LockedOut,PasswordExpired,PasswordLastSet,Enabled — full account state"
  - "Unlock-ADAccount -Identity <username> — clear the lockout"
  - "Set-ADAccountPassword -Identity <username> -Reset — set a temporary password"
  - "Set-ADUser <username> -ChangePasswordAtLogon $true — force a password change at next logon"
  - "nltest /dsgetdc:corp.local — check domain controller connectivity"

initial_ticket:
  subject: "VPN won't accept my password after vacation"
  body: |
    Hi, I just got back from three weeks out of office and I can't get into anything.
    The VPN keeps saying authentication failed. I'm 100% sure I'm typing my password
    correctly — it's the same one I've used for months. I've tried at least a dozen
    times. I work from home full time so I literally cannot do anything until this
    is fixed. Please help!

system_state:
  hostname: "HELPDESK-ADMIN"
  username: "asanders"
  full_name: "Alicia Sanders"
  domain: "CORP"

commands:
  # Quick first look: both the lockout and the stale password date are visible here.
  - id: net_user
    match_pattern: "^net\\s+user\\s+\\S+"
    output: |
      User name                    {username}
      Full Name                    {full_name}
      Account active               Locked
      Account expires              Never

      Password last set            5/29/2026 8:03:11 AM
      Password expires             6/28/2026 8:03:11 AM
      Password changeable          5/30/2026 8:03:11 AM
      Password required            Yes
      User may change password     Yes

      Last logon                   6/6/2026 4:47:29 PM
      The command completed successfully.
    reveals: "lockout_visible"
    conditional_outputs:
      - requires: [account_unlocked, temp_password_set]
        output: |
          User name                    {username}
          Full Name                    {full_name}
          Account active               Yes
          Account expires              Never

          Password last set            7/1/2026 9:12:40 AM
          Password expires             7/31/2026 9:12:40 AM
          Password changeable          7/2/2026 9:12:40 AM
          Password required            Yes
          User may change password     Yes

          Last logon                   6/6/2026 4:47:29 PM
          The command completed successfully.
        reveals: "fix_verified"

  - id: get_aduser
    match_pattern: "^Get-ADUser\\b"
    output: |
      DistinguishedName : CN={full_name},OU=Remote,OU=Staff,DC=corp,DC=local
      Enabled           : True
      LockedOut         : True
      Name              : {full_name}
      PasswordExpired   : True
      PasswordLastSet   : 5/29/2026 8:03:11 AM
      SamAccountName    : {username}
    reveals: "lockout_and_expiry_confirmed"
    conditional_outputs:
      - requires: [account_unlocked, temp_password_set]
        output: |
          DistinguishedName : CN={full_name},OU=Remote,OU=Staff,DC=corp,DC=local
          Enabled           : True
          LockedOut         : False
          Name              : {full_name}
          PasswordExpired   : False
          PasswordLastSet   : 7/1/2026 9:12:40 AM
          SamAccountName    : {username}
        reveals: "fix_verified"
      # Unlocked but password still expired — the account will just re-lock.
      - requires: account_unlocked
        output: |
          DistinguishedName : CN={full_name},OU=Remote,OU=Staff,DC=corp,DC=local
          Enabled           : True
          LockedOut         : False
          Name              : {full_name}
          PasswordExpired   : True
          PasswordLastSet   : 5/29/2026 8:03:11 AM
          SamAccountName    : {username}
        reveals: "expiry_still_outstanding"

  - id: unlock_adaccount
    match_pattern: "^Unlock-ADAccount\\b"
    output: |
      (no output — account unlocked)
    reveals: "account_unlocked"

  - id: set_adaccountpassword
    match_pattern: "^Set-ADAccountPassword\\b"
    output: |
      Please enter the desired password for 'CN={full_name},OU=Remote,OU=Staff,DC=corp,DC=local'
      Password: ************
      Repeat Password: ************
      (temporary password set)
    reveals: "temp_password_set"

  - id: set_change_at_logon
    match_pattern: "^Set-ADUser\\b.*ChangePasswordAtLogon"
    output: |
      (no output — user must change password at next logon)
    reveals: "must_change_enforced"

  # Red herring: the domain controller is healthy — this is an account problem,
  # not an infrastructure one.
  # (|2 = explicit block indent, needed because the first output line starts with spaces)
  - id: nltest
    match_pattern: "^nltest\\b"
    output: |2
                 DC: \\DC01.corp.local
            Address: \\192.168.1.10
           Dom Name: CORP
        Forest Name: corp.local
      The command completed successfully
    reveals: null

optimal_path:
  - net_user
  - get_aduser
  - unlock_adaccount
  - set_adaccountpassword
  - set_change_at_logon
  - get_aduser

resolution_paths:
  - id: verified_full_fix
    label: "Unlocked the account, reset a temporary password, and verified the account state"
    required_discoveries:
      - lockout_and_expiry_confirmed
      - account_unlocked
      - temp_password_set
      - fix_verified
    score_modifier: 1.0

  - id: unverified_full_fix
    label: "Unlocked the account and reset the password but did not verify afterward"
    required_discoveries:
      - lockout_and_expiry_confirmed
      - account_unlocked
      - temp_password_set
    score_modifier: 0.9

  # The trap this scenario is built around: unlocking without addressing the
  # expired password leaves the user in exactly the same failure loop.
  - id: unlock_only
    label: "Unlocked the account but left the expired password — user will re-lock immediately"
    required_discoveries:
      - account_unlocked
    score_modifier: 0.45

  # The mirror-image mistake: a new password doesn't matter while the lockout holds.
  - id: reset_without_unlock
    label: "Reset the password but never cleared the lockout — user still cannot log in"
    required_discoveries:
      - temp_password_set
    score_modifier: 0.5

  - id: diagnosed_escalated
    label: "Confirmed the lockout and expiry but escalated instead of using delegated access"
    required_discoveries:
      - lockout_and_expiry_confirmed
    score_modifier: 0.6

  - id: partial_diagnosis
    label: "Saw the lockout but did not identify the expired password behind it"
    required_discoveries:
      - lockout_visible
    score_modifier: 0.4

  - id: blind_escalation
    label: "Escalated without running diagnostics"
    required_discoveries: []
    score_modifier: 0.15
