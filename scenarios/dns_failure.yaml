id: dns_failure
title: "DNS Resolution Failure"
category: dns
system_template: linux_desktop
shell: bash
description: >
  Linux desktop user cannot resolve domain names. Root cause is a manual DNS override
  in the workstation's NetworkManager connection profile pointing to a non-functional
  IP (10.0.0.99) — DHCP is offering the correct corporate DNS server (192.168.1.53)
  but the manual setting overrides it. IP connectivity is intact; the problem is
  exclusively DNS. This is within T1 reach: the ideal resolution is to identify the
  override in the connection profile, correct it with nmcli to the DHCP-offered
  corporate server (192.168.1.53 — a public resolver would not fix internal names),
  reapply the connection, and verify resolution works. Diagnosing the bad nameserver
  and escalating to the network team with findings is also a strong resolution.

available_commands:
  - "ping <domain or IP> — test basic network connectivity and DNS resolution"
  - "nslookup <domain> / dig <domain> — query DNS resolution directly"
  - "cat /etc/resolv.conf — view the configured DNS nameserver"
  - "ifconfig / ip addr — view IP address and interface status"
  - "traceroute <destination> — trace the network path to a destination"
  - "nmcli con show [\"<name>\"] — list NetworkManager connections, or show one profile's settings (incl. DNS)"
  - "nmcli con mod \"<name>\" ipv4.dns <server> — set the connection's DNS server"
  - "nmcli con up \"<name>\" — reapply the connection so DNS changes take effect"

initial_ticket:
  subject: "Can't reach company wiki and some websites"
  body: |
    Hi, I've been trying to reach the company wiki at wiki.company.internal all morning and it
    keeps timing out. A few other sites won't load either. My internet feels like it's working
    though — YouTube loaded fine. Not sure if it's something on my end or a network problem.
    Any help appreciated!

# Facts about the simulated system — used to fill in output templates below.
system_state:
  hostname: "DESKTOP-042"
  username: "jsmith"
  ip_address: "192.168.1.105"
  gateway: "192.168.1.1"
  bad_dns: "10.0.0.99"
  good_dns: "192.168.1.53"
  connection_name: "Wired connection 1"

# Each command the operator can run in the simulated shell.
# match_pattern: a Python regex tested against the full command string (case-insensitive).
# output: what the terminal prints back. {variables} are filled from system_state,
#         or from the command itself (e.g. {target} = whatever they pinged).
# reveals: a discovery ID added to the ticket's discovery log when this command is run.
#          null means the command runs but reveals nothing useful (red herring).
# conditional_outputs: alternate output used once the listed discoveries exist —
#          this is how the shell reflects the fix after the operator applies it.
commands:
  - id: ping_domain
    match_pattern: "^ping\\s+(?!\\d+\\.\\d+\\.\\d+\\.\\d+)\\S+"
    output: |
      ping: {target}: Temporary failure in name resolution
    reveals: "domain_ping_fails"
    conditional_outputs:
      - requires: dns_applied
        output: |
          PING {target} ({good_dns}) 56(84) bytes of data.
          64 bytes from {target}: icmp_seq=1 ttl=63 time=1.82 ms
          64 bytes from {target}: icmp_seq=2 ttl=63 time=1.74 ms
          ^C
          --- {target} ping statistics ---
          2 packets transmitted, 2 received, 0% packet loss, time 1001ms
        reveals: "fix_verified"

  - id: ping_ip
    match_pattern: "^ping\\s+\\d+\\.\\d+\\.\\d+\\.\\d+"
    output: |
      PING {target} ({target}) 56(84) bytes of data.
      64 bytes from {target}: icmp_seq=1 ttl=118 time=12.4 ms
      64 bytes from {target}: icmp_seq=2 ttl=118 time=11.9 ms
      ^C
      --- {target} ping statistics ---
      2 packets transmitted, 2 received, 0% packet loss, time 1001ms
    reveals: "ip_connectivity_works"

  - id: nslookup_dig
    match_pattern: "^(nslookup|dig)\\s+"
    output: |
      Server:		{bad_dns}
      Address:	{bad_dns}#53

      ;; connection timed out; no servers could be reached
    reveals: "dns_server_unreachable"
    conditional_outputs:
      - requires: dns_applied
        output: |
          Server:		{good_dns}
          Address:	{good_dns}#53

          Name:	{target}
          Address: 192.168.1.20
        reveals: "fix_verified"

  - id: cat_resolv
    match_pattern: "^cat\\s+/etc/resolv\\.conf"
    output: |
      # Generated by NetworkManager
      nameserver {bad_dns}
    reveals: "bad_nameserver_visible"
    conditional_outputs:
      - requires: dns_applied
        output: |
          # Generated by NetworkManager
          nameserver {good_dns}
        reveals: null

  - id: ifconfig
    match_pattern: "^(ifconfig|ip addr show|ip a)$"
    output: |
      eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500
              inet {ip_address}  netmask 255.255.255.0  broadcast 192.168.1.255
              ether 02:42:ac:11:00:02  txqueuelen 0  (Ethernet)
              RX packets 18423  bytes 24157832 (23.0 MiB)
    reveals: "ip_address_visible"

  # Red herring: shows routing is fine but doesn't help locate the DNS problem.
  - id: traceroute
    match_pattern: "^(traceroute|tracepath)\\s+"
    output: |
      traceroute to {target}, 30 hops max, 60 byte packets
       1  _gateway ({gateway})  0.432 ms  0.389 ms  0.412 ms
       2  * * *
       3  * * *
       4  * * *
      (... requests timing out beyond gateway)
    reveals: null

  # The smoking gun: the connection profile has a manual DNS override, while
  # DHCP is offering the correct corporate server. Order matters — this pattern
  # (show + argument) must come before the bare `con show` list below.
  - id: nmcli_show_connection
    match_pattern: "^nmcli\\s+con(nection)?\\s+show\\s+\\S+"
    output: |
      connection.id:                          {connection_name}
      connection.type:                        802-3-ethernet
      ipv4.method:                            auto
      ipv4.dns:                               {bad_dns}
      ipv4.ignore-auto-dns:                   no
      IP4.ADDRESS[1]:                         {ip_address}/24
      IP4.GATEWAY:                            {gateway}
      DHCP4.OPTION[6]:                        domain_name_servers = {good_dns}
    reveals: "manual_dns_override_found"
    conditional_outputs:
      - requires: dns_reconfigured
        output: |
          connection.id:                          {connection_name}
          connection.type:                        802-3-ethernet
          ipv4.method:                            auto
          ipv4.dns:                               {good_dns}
          ipv4.ignore-auto-dns:                   no
          IP4.ADDRESS[1]:                         {ip_address}/24
          IP4.GATEWAY:                            {gateway}
          DHCP4.OPTION[6]:                        domain_name_servers = {good_dns}
        reveals: null

  - id: nmcli_list
    match_pattern: "^nmcli\\s+con(nection)?\\s+show\\s*$"
    output: |
      NAME                UUID                                  TYPE      DEVICE
      {connection_name}  9c8ecccc-4a26-42cb-806b-57a932f2f5b3  ethernet  eth0
    reveals: null

  # The fix only counts with the correct corporate DNS (the one DHCP is offering,
  # visible in the profile output above). Setting a public resolver like 8.8.8.8
  # would not restore internal name resolution — that falls through to the generic
  # pattern below, which updates the profile but leaves the scenario broken.
  - id: nmcli_mod
    match_pattern: "^nmcli\\s+con(nection)?\\s+mod(ify)?\\s+.+ipv4\\.dns\\s+\"?192\\.168\\.1\\.53"
    output: |
      (no output — connection profile updated)
    reveals: "dns_reconfigured"

  - id: nmcli_mod_wrong_value
    match_pattern: "^nmcli\\s+con(nection)?\\s+mod(ify)?\\s+.+ipv4\\.dns\\s+\\S+"
    output: |
      (no output — connection profile updated)
    reveals: null

  # Reapplying the connection regenerates resolv.conf. Only counts as the fix
  # being live if the DNS setting was actually changed first.
  - id: nmcli_up
    match_pattern: "^nmcli\\s+con(nection)?\\s+up\\s+\\S+"
    output: |
      Connection successfully activated (D-Bus active path: /org/freedesktop/NetworkManager/ActiveConnection/3)
    reveals: null
    conditional_outputs:
      - requires: dns_reconfigured
        output: |
          Connection successfully activated (D-Bus active path: /org/freedesktop/NetworkManager/ActiveConnection/3)
        reveals: "dns_applied"

# Optimal diagnostic path — used by the grading model to score efficiency.
# Establish "IP works, DNS doesn't", find the bad server, trace it to the manual
# override in the connection profile, fix, reapply, and verify.
optimal_path:
  - ping_domain
  - ping_ip
  - nslookup_dig
  - cat_resolv
  - nmcli_show_connection
  - nmcli_mod
  - nmcli_up
  - nslookup_dig

# How the ticket can be resolved. The grading model checks which discoveries
# are present in the command log and picks the best matching path.
resolution_paths:
  - id: verified_direct_fix
    label: "Corrected the DNS override via nmcli and verified resolution works"
    required_discoveries:
      - bad_nameserver_visible
      - dns_applied
      - fix_verified
    score_modifier: 1.0

  - id: unverified_direct_fix
    label: "Corrected the DNS misconfiguration but did not verify resolution afterward"
    required_discoveries:
      - bad_nameserver_visible
      - dns_applied
    score_modifier: 0.9

  - id: correct_escalation
    label: "Diagnosed DNS issue and escalated to network team with findings"
    required_discoveries:
      - dns_server_unreachable
      - bad_nameserver_visible
    score_modifier: 0.95   # nearly as good — correct diagnosis + correct escalation

  - id: partial_diagnosis
    label: "Identified DNS failure but did not locate the specific misconfiguration"
    required_discoveries:
      - dns_server_unreachable
    score_modifier: 0.55

  - id: blind_escalation
    label: "Escalated without diagnosing the issue"
    required_discoveries: []
    score_modifier: 0.2
